name: Deploy bvx-editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # deploy-pages v4+ reads the uploaded artifact via the Actions API
  pages: write
  id-token: write

# Allow only one concurrent deployment, but let in-progress runs finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # bvx-editor depends on bvx-kit via file:../bvx-kit, so compile the kit first
      - name: Build bvx-kit
        working-directory: bvx-kit
        run: |
          npm install
          npm run build-ts

      # Project pages are served from /<repo>/, hence the explicit base
      - name: Build bvx-editor
        working-directory: bvx-editor
        run: |
          npm install
          npx tsc --noEmit
          npx vite build --base=/bvx-kit/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: bvx-editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
