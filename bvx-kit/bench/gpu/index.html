<script type="module">
import {
  WORDS_PER_CHUNK, BVX_PER_CHUNK, buildWorld, subWorld, mixedIndices,
  cpuMeshRange, uniformState, S_MIXED
} from './mesher.js';

const logEl = document.getElementById('log');
const lines = [];
const R = {};
function log(s) { lines.push(s); logEl.textContent = lines.join('\n'); console.log('[BENCH] ' + s); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Run fn repeatedly until at least minMs of wall clock has elapsed, return the
// best per-iteration time. performance.now() is 5 us granular even when the page
// is cross-origin isolated, so short workloads must be batched into the timed
// region rather than timed individually.
function timeCPU(fn, minMs = 60) {
  fn(); fn();
  let reps = 1;
  for (;;) {
    const s = performance.now();
    for (let i = 0; i < reps; i++) fn();
    const el = performance.now() - s;
    if (el >= minMs) return el / reps;
    reps = Math.max(reps * 2, Math.ceil(reps * (minMs / Math.max(el, 0.01))));
    if (reps > 1e7) return el / reps;
  }
}

// ---------------------------------------------------------------------------
// WGSL face mesher. One workgroup per chunk, 128 invocations, one u32 occupancy
// word (32 BitVoxels) per invocation. The centre chunk is staged into workgroup
// memory (512 B). Every invocation reaches every barrier - no early return.
//
// Per thread: phase 1 counts, one atomicAdd reserves a contiguous output range,
// phase 2 emits. A per-voxel global atomic would be contention bound and would
// understate the GPU.
// ---------------------------------------------------------------------------
const MESH_WGSL = `
struct Params { chunkCount: u32, emit: u32, pad0: u32, pad1: u32 };

@group(0) @binding(0) var<storage, read>       occ    : array<u32>;
@group(0) @binding(1) var<storage, read>       nbr    : array<i32>;
@group(0) @binding(2) var<storage, read_write> counts : array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> outBuf : array<u32>;
@group(0) @binding(4) var<uniform>             params : Params;

var<workgroup> centre    : array<u32, 128>;
var<workgroup> wgFaces   : atomic<u32>;
var<workgroup> wgTouched : atomic<u32>;

fn dx_(i: u32) -> i32 { return i32((((i >> 10u) & 3u) << 2u) | ((i >> 4u) & 3u)); }
fn dy_(i: u32) -> i32 { return i32((((i >>  8u) & 3u) << 2u) | ((i >> 2u) & 3u)); }
fn dz_(i: u32) -> i32 { return i32((((i >>  6u) & 3u) << 2u) | (i & 3u)); }
fn enc_(x: u32, y: u32, z: u32) -> u32 {
  return ((x >> 2u) << 10u) | ((y >> 2u) << 8u) | ((z >> 2u) << 6u)
       | ((x & 3u) << 4u) | ((y & 3u) << 2u) | (z & 3u);
}

// 1 when the neighbour of BitVoxel i in direction d is solid. A missing
// neighbour chunk reads as air, matching VoxelFaceGeometry's placeholder chunk.
fn sample_(i: u32, d: u32, chunk: u32) -> u32 {
  let x = dx_(i); let y = dy_(i); let z = dz_(i);
  var nx = x; var ny = y; var nz = z;
  switch d {
    case 0u: { nx = x + 1; }
    case 1u: { nx = x - 1; }
    case 2u: { ny = y + 1; }
    case 3u: { ny = y - 1; }
    case 4u: { nz = z + 1; }
    default: { nz = z - 1; }
  }
  let ni = enc_(u32(nx & 15), u32(ny & 15), u32(nz & 15));
  if (nx >= 0 && nx <= 15 && ny >= 0 && ny <= 15 && nz >= 0 && nz <= 15) {
    return (centre[ni >> 5u] >> (ni & 31u)) & 1u;
  }
  let slot = nbr[chunk * 8u + d];
  if (slot < 0) { return 0u; }
  return (occ[u32(slot) * 128u + (ni >> 5u)] >> (ni & 31u)) & 1u;
}

fn mask_(i: u32, chunk: u32) -> u32 {
  return ((sample_(i, 0u, chunk) ^ 1u)      ) | ((sample_(i, 1u, chunk) ^ 1u) << 1u)
       | ((sample_(i, 2u, chunk) ^ 1u) << 2u) | ((sample_(i, 3u, chunk) ^ 1u) << 3u)
       | ((sample_(i, 4u, chunk) ^ 1u) << 4u) | ((sample_(i, 5u, chunk) ^ 1u) << 5u);
}

@compute @workgroup_size(128)
fn main(@builtin(workgroup_id) wg: vec3<u32>, @builtin(local_invocation_id) lid: vec3<u32>) {
  let chunk = wg.x;
  let w = lid.x;

  centre[w] = occ[chunk * 128u + w];
  if (w == 0u) { atomicStore(&wgFaces, 0u); atomicStore(&wgTouched, 0u); }
  workgroupBarrier();

  let word = centre[w];

  var localFaces = 0u;
  var localTouched = 0u;
  var scan = word;
  loop {
    if (scan == 0u) { break; }
    let bit = firstTrailingBit(scan);
    scan = scan & (scan - 1u);
    let m = mask_((w << 5u) | bit, chunk);
    if (m != 0u) { localTouched = localTouched + 1u; localFaces = localFaces + countOneBits(m); }
  }

  if (localTouched > 0u) {
    atomicAdd(&wgFaces, localFaces);
    atomicAdd(&wgTouched, localTouched);

    if (params.emit == 1u) {
      var cursor = atomicAdd(&counts[2], localTouched);
      var scan2 = word;
      loop {
        if (scan2 == 0u) { break; }
        let bit = firstTrailingBit(scan2);
        scan2 = scan2 & (scan2 - 1u);
        let idx = (w << 5u) | bit;
        let m = mask_(idx, chunk);
        if (m != 0u) {
          if (cursor < arrayLength(&outBuf)) { outBuf[cursor] = (chunk << 18u) | (idx << 6u) | m; }
          cursor = cursor + 1u;
        }
      }
    }
  }

  workgroupBarrier();
  if (w == 0u) {
    atomicAdd(&counts[0], atomicLoad(&wgFaces));
    atomicAdd(&counts[1], atomicLoad(&wgTouched));
  }
}
`;

const NOOP_WGSL = `
@group(0) @binding(0) var<storage, read_write> sink : array<atomic<u32>>;
@compute @workgroup_size(64)
fn main(@builtin(workgroup_id) wg: vec3<u32>, @builtin(local_invocation_id) lid: vec3<u32>) {
  if (wg.x == 0xffffffffu) { atomicAdd(&sink[0], lid.x); }
}
`;

// macOS demotes a hidden tab's renderer process to background QoS, which parks it
// on the efficiency cores. Measured effect on this machine: the CPU mesher went
// from 19.5 to 237.6 us/chunk between a visible and a hidden run, while the GPU
// number moved 1.5%. So a hidden run cannot produce a usable CPU baseline - gate
// on visibility rather than silently reporting a 12x-too-slow CPU.
let wentHidden = false;
async function requireVisible() {
  if (!document.hidden) return;
  logEl.textContent = 'WAITING: bring this tab to the front - CPU timings are invalid while it is hidden.';
  await new Promise(res => {
    const h = () => { if (!document.hidden) { document.removeEventListener('visibilitychange', h); res(); } };
    document.addEventListener('visibilitychange', h);
  });
  await sleep(500);
}

async function main() {
  await requireVisible();
  document.addEventListener('visibilitychange', () => { if (document.hidden) wentHidden = true; });
  R.crossOriginIsolated = self.crossOriginIsolated;
  R.hardwareConcurrency = navigator.hardwareConcurrency;
  log(`crossOriginIsolated=${self.crossOriginIsolated}  hardwareConcurrency=${navigator.hardwareConcurrency}`);
  if (!self.crossOriginIsolated) log('WARNING: timers clamped to 100us, results below the millisecond are unusable');

  if (!navigator.gpu) { R.error = 'no navigator.gpu'; log('no WebGPU'); return finish(); }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { R.error = 'no adapter'; log('no adapter'); return finish(); }
  const device = await adapter.requestDevice();
  let gpuErrors = 0;
  device.addEventListener?.('uncapturederror', e => { gpuErrors++; if (gpuErrors < 4) log('GPU ERROR: ' + e.error.message); });

  const info = adapter.info ?? {};
  R.adapter = {
    vendor: info.vendor, architecture: info.architecture, device: info.device, description: info.description,
    maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize,
    maxBufferSize: adapter.limits.maxBufferSize,
    maxComputeInvocationsPerWorkgroup: adapter.limits.maxComputeInvocationsPerWorkgroup,
    maxComputeWorkgroupStorageSize: adapter.limits.maxComputeWorkgroupStorageSize,
    maxComputeWorkgroupsPerDimension: adapter.limits.maxComputeWorkgroupsPerDimension,
    maxStorageBuffersPerShaderStage: adapter.limits.maxStorageBuffersPerShaderStage,
    hasSubgroups: adapter.features.has('subgroups'),
    hasTimestampQuery: adapter.features.has('timestamp-query'),
  };
  log('adapter: ' + JSON.stringify(R.adapter));

  // ---------------- worlds ----------------
  log('\n--- building worlds (value-noise terrain heightfield) ---');
  const world = buildWorld(24, 6, 24, true);
  const surf = subWorld(world, mixedIndices(world), true);
  log(`mixed-world : ${world.count} chunks  empty=${world.classes.empty} full=${world.classes.full} mixed=${world.classes.mixed}` +
      `  (${(100 * world.classes.mixed / world.count).toFixed(1)}% surface)`);
  log(`surface-only: ${surf.count} chunks (all mixed)`);
  R.world = { count: world.count, ...world.classes, surfaceCount: surf.count };

  // ---------------- CPU: 1 thread ----------------
  log('\n--- CPU baseline, 1 thread (faithful port of the optimised kit mesher) ---');
  const cpu1 = {};
  for (const [name, w] of [['mixed-world', world], ['surface-only', surf]]) {
    const ms = timeCPU(() => cpuMeshRange(w.occ, w.nb, 0, w.count), 120);
    const ref = cpuMeshRange(w.occ, w.nb, 0, w.count);
    cpu1[name] = { ms, usPerChunk: ms * 1000 / w.count, chunks: w.count, ...ref };
    log(`  ${name.padEnd(13)}: ${ms.toFixed(3)} ms / ${w.count} chunks = ${(ms * 1000 / w.count).toFixed(2)} us/chunk   faces=${ref.faces}`);
  }
  R.cpu1 = cpu1;

  // ---------------- CPU: N workers ----------------
  log('\n--- CPU baseline, worker pool (the honest multicore comparison) ---');
  const cpuN = {};
  const POOLS = [2, 4, 8].filter(n => n <= (navigator.hardwareConcurrency || 8));
  for (const nw of POOLS) {
    const workers = [];
    for (let i = 0; i < nw; i++) workers.push(new Worker('./worker.js', { type: 'module' }));
    await Promise.all(workers.map(wk => new Promise(res => {
      wk.onmessage = (e) => { if (e.data.cmd === 'ready') res(); };
      wk.postMessage({ cmd: 'attach', occ: surf.occ.buffer, nb: surf.nb.buffer });
    })));

    const runOnce = (reps) => Promise.all(workers.map((wk, i) => new Promise(res => {
      const from = Math.floor(i * surf.count / nw), to = Math.floor((i + 1) * surf.count / nw);
      wk.onmessage = (e) => { if (e.data.cmd === 'done') res(e.data); };
      wk.postMessage({ cmd: 'mesh', from, to, reps });
    })));

    // Long warm-up: the timed region must not include V8's baseline tier. With
    // only 2 warm-up reps the pool measured SLOWER than one thread, which is a
    // JIT artefact rather than a real result.
    await runOnce(40);
    const REPS = 60;
    const s = performance.now();
    const parts = await runOnce(REPS);
    const ms = (performance.now() - s) / REPS;
    const faces = parts.reduce((a, p) => a + p.faces, 0);
    cpuN[nw] = { ms, usPerChunk: ms * 1000 / surf.count, faces };
    log(`  ${nw} workers, surface-only: ${ms.toFixed(3)} ms / ${surf.count} chunks = ${(ms * 1000 / surf.count).toFixed(2)} us/chunk` +
        `   (${(cpu1['surface-only'].ms / ms).toFixed(2)}x vs 1 thread)`);
    workers.forEach(w => w.terminate());
    await sleep(50);
  }
  R.cpuWorkers = cpuN;

  // ---------------- GPU setup ----------------
  const mod = device.createShaderModule({ code: MESH_WGSL });
  const ci = await mod.getCompilationInfo();
  const errs = ci.messages.filter(m => m.type === 'error');
  if (errs.length) { errs.forEach(m => log(`WGSL ERROR line ${m.lineNum}: ${m.message}`)); R.error = 'wgsl'; return finish(); }
  log('\nWGSL compiled clean.');
  const pipe = device.createComputePipeline({ layout: 'auto', compute: { module: mod, entryPoint: 'main' } });

  const OUT_SLOTS = 1 << 22;
  const outBuf = device.createBuffer({ size: OUT_SLOTS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const cntBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  const readBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  function upload(w) {
    const occBuf = device.createBuffer({ size: w.occ.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const nbBuf = device.createBuffer({ size: w.nb.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(occBuf, 0, w.occ);
    device.queue.writeBuffer(nbBuf, 0, w.nb);
    const pBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(pBuf, 0, new Uint32Array([w.count, 1, 0, 0]));
    const bg = device.createBindGroup({
      layout: pipe.getBindGroupLayout(0), entries: [
        { binding: 0, resource: { buffer: occBuf } }, { binding: 1, resource: { buffer: nbBuf } },
        { binding: 2, resource: { buffer: cntBuf } }, { binding: 3, resource: { buffer: outBuf } },
        { binding: 4, resource: { buffer: pBuf } }]
    });
    return { occBuf, nbBuf, pBuf, bg, count: w.count, free() { occBuf.destroy(); nbBuf.destroy(); pBuf.destroy(); } };
  }

  function encodeMesh(g, n) {
    const e = device.createCommandEncoder();
    e.clearBuffer(cntBuf);
    const p = e.beginComputePass();
    p.setPipeline(pipe); p.setBindGroup(0, g.bg); p.dispatchWorkgroups(n ?? g.count); p.end();
    return e;
  }

  async function gpuTime(g, minMs = 80, n) {
    for (let i = 0; i < 3; i++) device.queue.submit([encodeMesh(g, n).finish()]);
    await device.queue.onSubmittedWorkDone();
    let reps = 4;
    for (;;) {
      const s = performance.now();
      for (let i = 0; i < reps; i++) device.queue.submit([encodeMesh(g, n).finish()]);
      await device.queue.onSubmittedWorkDone();
      const el = performance.now() - s;
      if (el >= minMs || reps > 20000) return el / reps;
      reps = Math.max(reps * 2, Math.ceil(reps * (minMs / Math.max(el, 0.01))));
    }
  }

  async function gpuVerify(g, n) {
    device.queue.submit([encodeMesh(g, n).finish()]);
    const e = device.createCommandEncoder();
    e.copyBufferToBuffer(cntBuf, 0, readBuf, 0, 16);
    device.queue.submit([e.finish()]);
    await readBuf.mapAsync(GPUMapMode.READ);
    const c = new Uint32Array(readBuf.getMappedRange().slice(0));
    readBuf.unmap();
    return { faces: c[0], touched: c[1] };
  }

  log('\n--- GPU face mesher (1 workgroup/chunk, 128 threads, output compacted via atomics) ---');
  const gpu = {};
  const handles = {};
  for (const [name, w] of [['mixed-world', world], ['surface-only', surf]]) {
    const g = upload(w);
    handles[name] = g;
    const v = await gpuVerify(g);
    const ms = await gpuTime(g);
    const ok = v.faces === cpu1[name].faces && v.touched === cpu1[name].touched;
    gpu[name] = { ms, usPerChunk: ms * 1000 / w.count, ...v, matchesCPU: ok, chunks: w.count };
    log(`  ${name.padEnd(13)}: ${ms.toFixed(3)} ms / ${w.count} chunks = ${(ms * 1000 / w.count).toFixed(3)} us/chunk   ` +
        `faces=${v.faces} ${ok ? 'MATCHES CPU EXACTLY' : 'MISMATCH (cpu ' + cpu1[name].faces + '/' + cpu1[name].touched + ')'}`);
    log(`                 vs 1-thread CPU: ${(cpu1[name].ms / ms).toFixed(1)}x` +
        (name === 'surface-only' && cpuN[8] ? `   vs 8-worker CPU: ${(cpuN[8].ms / ms).toFixed(1)}x` : ''));
  }
  R.gpu = gpu;

  // ---------------- batch sweep: where is the crossover ----------------
  // The batch sweep dispatches a PREFIX of the already-uploaded surface world
  // rather than building an isolated sub-world per size. An isolated chunk has no
  // neighbours, so every one of its faces is visible and it costs 5-10x a real
  // chunk - which inflated both sides and made the speedups meaningless. Here the
  // input is byte-identical at every batch size and only the dispatch count varies.
  log('\n--- batch sweep: dispatch size vs cost, identical input at every size ---');
  const sweep = [];
  const gs = handles['surface-only'];
  for (const n of [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, surf.count]) {
    if (n > surf.count) continue;
    const gv = await gpuVerify(gs, n);
    const gms = await gpuTime(gs, 60, n);
    const cms = timeCPU(() => cpuMeshRange(surf.occ, surf.nb, 0, n), 60);
    const cref = cpuMeshRange(surf.occ, surf.nb, 0, n);
    const ok = gv.faces === cref.faces;
    sweep.push({ chunks: n, gpuMs: gms, gpuUsPerChunk: gms * 1000 / n, cpuMs: cms, cpuUsPerChunk: cms * 1000 / n, speedup: cms / gms, verified: ok });
    log(`  ${String(n).padStart(4)} ch: GPU ${gms.toFixed(4)} ms (${(gms * 1000 / n).toFixed(2)} us/ch)   ` +
        `CPU ${cms.toFixed(4)} ms (${(cms * 1000 / n).toFixed(2)} us/ch)   ` +
        `${cms / gms >= 1 ? 'GPU ' + (cms / gms).toFixed(2) + 'x' : 'CPU ' + (gms / cms).toFixed(2) + 'x'}${ok ? '' : '  !VERIFY FAILED'}`);
    await sleep(0);
  }
  R.batchSweep = sweep;

  // ---------------- dispatch overhead ----------------
  log('\n--- dispatch / submit overhead (empty kernel) ---');
  const noop = device.createComputePipeline({ layout: 'auto', compute: { module: device.createShaderModule({ code: NOOP_WGSL }), entryPoint: 'main' } });
  const noopBG = device.createBindGroup({ layout: noop.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: cntBuf } }] });
  const disp = [];
  for (const k of [1, 10, 100, 1000]) {
    const one = () => {
      const e = device.createCommandEncoder(); const p = e.beginComputePass();
      p.setPipeline(noop); p.setBindGroup(0, noopBG);
      for (let i = 0; i < k; i++) p.dispatchWorkgroups(1);
      p.end(); device.queue.submit([e.finish()]);
    };
    one(); one(); await device.queue.onSubmittedWorkDone();
    let reps = 20;
    let ms;
    for (;;) {
      const s = performance.now();
      for (let i = 0; i < reps; i++) one();
      await device.queue.onSubmittedWorkDone();
      ms = (performance.now() - s) / reps;
      if (ms * reps >= 60 || reps > 5000) break;
      reps *= 4;
    }
    disp.push({ dispatchesPerSubmit: k, msPerSubmit: ms, usPerDispatch: ms * 1000 / k });
    log(`  ${String(k).padStart(4)} dispatches in 1 submit: ${ms.toFixed(4)} ms/submit = ${(ms * 1000 / k).toFixed(3)} us/dispatch`);
  }
  // the latency case: submit and wait, one at a time
  {
    let total = 0; const iters = 100;
    for (let i = 0; i < iters + 5; i++) {
      const s = performance.now();
      const e = device.createCommandEncoder(); const p = e.beginComputePass();
      p.setPipeline(noop); p.setBindGroup(0, noopBG); p.dispatchWorkgroups(1); p.end();
      device.queue.submit([e.finish()]);
      await device.queue.onSubmittedWorkDone();
      if (i >= 5) total += performance.now() - s;
    }
    disp.push({ dispatchesPerSubmit: 'submit-and-await-each', msPerSubmit: total / iters });
    log(`  submit + await onSubmittedWorkDone, one at a time: ${(total / iters * 1000).toFixed(1)} us round trip`);
  }
  R.dispatch = disp;

  // ---------------- upload ----------------
  log('\n--- writeBuffer upload ---');
  const up = [];
  for (const bytes of [512, 512 * 27, 64 * 1024, 1024 * 1024, 16 * 1024 * 1024]) {
    const src = new Uint8Array(bytes);
    const dst = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    device.queue.writeBuffer(dst, 0, src); await device.queue.onSubmittedWorkDone();
    let reps = bytes > 1e6 ? 20 : 400;
    const s = performance.now();
    for (let i = 0; i < reps; i++) device.queue.writeBuffer(dst, 0, src);
    await device.queue.onSubmittedWorkDone();
    const ms = (performance.now() - s) / reps;
    up.push({ bytes, ms, gbPerSec: (bytes / 1e9) / (ms / 1000) });
    log(`  ${String(bytes).padStart(9)} B: ${ms.toFixed(4)} ms = ${((bytes / 1e9) / (ms / 1000)).toFixed(2)} GB/s`);
    dst.destroy();
  }
  {
    const dst = device.createBuffer({ size: 512 * 4096, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
    const src = new Uint8Array(512);
    for (const n of [25, 200, 1000]) {
      const reps = 20, s = performance.now();
      for (let it = 0; it < reps; it++) for (let i = 0; i < n; i++) device.queue.writeBuffer(dst, i * 512, src);
      await device.queue.onSubmittedWorkDone();
      const ms = (performance.now() - s) / reps;
      up.push({ scattered512B: n, ms, usEach: ms * 1000 / n });
      log(`  ${String(n).padStart(4)} scattered 512 B writes: ${ms.toFixed(4)} ms = ${(ms * 1000 / n).toFixed(3)} us each`);
    }
    dst.destroy();
  }
  R.upload = up;

  // ---------------- readback ----------------
  log('\n--- readback latency (copyBufferToBuffer + mapAsync) ---');
  const rb = [];
  for (const bytes of [16, 4096, 256 * 1024, 4 * 1024 * 1024]) {
    const src = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
    const dst = device.createBuffer({ size: bytes, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    let total = 0; const iters = 30;
    for (let i = 0; i < iters + 3; i++) {
      const s = performance.now();
      const e = device.createCommandEncoder(); e.copyBufferToBuffer(src, 0, dst, 0, bytes);
      device.queue.submit([e.finish()]);
      await dst.mapAsync(GPUMapMode.READ); dst.getMappedRange(); dst.unmap();
      if (i >= 3) total += performance.now() - s;
    }
    rb.push({ bytes, ms: total / iters });
    log(`  ${String(bytes).padStart(9)} B: ${(total / iters).toFixed(3)} ms round trip`);
    src.destroy(); dst.destroy();
  }
  // The editor case: a brush stroke dirties a handful of chunks, they are remeshed,
  // and the result has to come back before the next frame can be drawn. This is a
  // LATENCY measurement, not a throughput one.
  for (const n of [1, 4, 25]) {
    let total = 0; const iters = 40;
    for (let i = 0; i < iters + 4; i++) {
      const s = performance.now();
      const e = encodeMesh(gs, n);
      e.copyBufferToBuffer(cntBuf, 0, readBuf, 0, 16);
      device.queue.submit([e.finish()]);
      await readBuf.mapAsync(GPUMapMode.READ); readBuf.getMappedRange(); readBuf.unmap();
      if (i >= 4) total += performance.now() - s;
    }
    const ms = total / iters;
    const cms = timeCPU(() => cpuMeshRange(surf.occ, surf.nb, 0, n), 40);
    rb.push({ remeshAndReadbackChunks: n, ms, cpuMs: cms });
    log(`  remesh ${String(n).padStart(2)} chunk(s) + read counters back: ${ms.toFixed(3)} ms   ` +
        `(CPU same work, no round trip: ${cms.toFixed(4)} ms -> CPU ${(ms / cms).toFixed(1)}x lower latency)`);
  }
  R.readback = rb;

  // ---------------- cold-fill projection ----------------
  const g = handles['surface-only'];
  log('\n--- sustained throughput ---');
  log(`  GPU: ${(surf.count / (gpu['surface-only'].ms / 1000) / 1000).toFixed(0)}k surface chunks/s`);
  log(`  CPU 1 thread: ${(surf.count / (cpu1['surface-only'].ms / 1000) / 1000).toFixed(1)}k surface chunks/s`);
  if (cpuN[8]) log(`  CPU 8 workers: ${(surf.count / (cpuN[8].ms / 1000) / 1000).toFixed(1)}k surface chunks/s`);
  R.gpuErrors = gpuErrors;
  R.wentHidden = wentHidden;
  log(`\nuncaptured GPU errors: ${gpuErrors}`);
  log(wentHidden
    ? '\n*** TAB WAS HIDDEN DURING THE RUN - CPU FIGURES ARE INVALID, RE-RUN IN THE FOREGROUND ***'
    : '\ntab stayed visible for the whole run - CPU figures valid');
  log('\n=== DONE ===');
  finish();
}

function finish() {
  window.__R__ = R; window.__DONE__ = true;
  console.log('[BENCH-JSON] ' + JSON.stringify(R));
}

main().catch(e => { log('FATAL: ' + (e && e.stack || e)); R.error = String(e && e.message || e); finish(); });
</script>
