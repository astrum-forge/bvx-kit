<meta charset="utf-8">
<title>bvx-kit GPU smooth mesher verification</title>
<style>
  body { font: 12.5px ui-monospace, Menlo, monospace; background:#111; color:#ddd; padding:16px; }
  pre { white-space: pre-wrap; line-height:1.45; }
  .ok { color:#7c7 } .bad { color:#f77 }
</style>
<h3>bvx-kit — GPU smooth mesher vs CPU</h3>
<pre id="log">starting…</pre>
<script type="module">
import {
  VoxelWorld, VoxelChunk16, VoxelIndex, MortonKey,
  CpuSmoothMesher, GpuSmoothMesher
} from '../../out/index.js';

// ?readback=1 exercises the CPU-readback mode the editor uses, which must agree
// with the device-resident mode it wraps.
const READBACK = new URLSearchParams(location.search).get('readback') === '1';

const logEl = document.getElementById('log');
const lines = [];
const R = { cases: [] };
function log(s) { lines.push(s); logEl.textContent = lines.join('\n'); console.log('[VERIFY] ' + s); }

const encode = (x, y, z) => ((x >> 2) << 10) | ((y >> 2) << 8) | ((z >> 2) << 6) | ((x & 3) << 4) | ((y & 3) << 2) | (z & 3);

function hash2(x, y) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >> 13), 1274126177);
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}

// Terrain, plus a couple of hand-made shapes that stress specific cases:
// a lone voxel (every cell a surface cell), a solid block (only its shell),
// and a diagonal staircase (many degenerate-ish gradients).
function buildWorld() {
  const world = new VoxelWorld();
  const idx = new VoxelIndex();

  for (let cx = 0; cx < 5; cx++) {
    for (let cy = 0; cy < 2; cy++) {
      for (let cz = 0; cz < 5; cz++) {
        const chunk = new VoxelChunk16(MortonKey.from(cx + 1, cy + 1, cz + 1));
        let solid = 0;

        for (let x = 0; x < 16; x++) {
          for (let z = 0; z < 16; z++) {
            const wx = cx * 16 + x, wz = cz * 16 + z;
            const h = Math.floor(noise(wx / 20, wz / 20) * 32 * 0.7);
            for (let y = 0; y < 16; y++) {
              if (cy * 16 + y < h) { idx.key = encode(x, y, z); chunk.setBitVoxel(idx); solid++; }
            }
          }
        }
        if (solid > 0) world.insert(chunk);
      }
    }
  }

  // lone voxel
  {
    const chunk = new VoxelChunk16(MortonKey.from(9, 9, 9));
    const idx2 = new VoxelIndex(); idx2.key = encode(8, 8, 8);
    chunk.setBitVoxel(idx2);
    world.insert(chunk);
  }
  // solid block
  {
    const chunk = new VoxelChunk16(MortonKey.from(12, 12, 12));
    const idx2 = new VoxelIndex();
    for (let x = 0; x < 16; x++) for (let y = 0; y < 16; y++) for (let z = 0; z < 16; z++) {
      idx2.key = encode(x, y, z); chunk.setBitVoxel(idx2);
    }
    world.insert(chunk);
  }
  // diagonal staircase
  {
    const chunk = new VoxelChunk16(MortonKey.from(15, 15, 15));
    const idx2 = new VoxelIndex();
    for (let x = 0; x < 16; x++) for (let z = 0; z < 16; z++) {
      const h = Math.min(15, x + z >> 1);
      for (let y = 0; y <= h; y++) { idx2.key = encode(x, y, z); chunk.setBitVoxel(idx2); }
    }
    world.insert(chunk);
  }

  return world;
}

// Triangles compared as an order-independent multiset: the GPU appends them
// atomically so their order differs from the CPU's, while the set must not.
function triangleKeys(indices, count) {
  const keys = [];
  for (let i = 0; i < count; i += 3) {
    keys.push(`${indices[i]},${indices[i + 1]},${indices[i + 2]}`);
  }
  keys.sort();
  return keys;
}

async function readBuffer(device, src, byteOffset, byteLength) {
  const dst = device.createBuffer({ size: byteLength, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const e = device.createCommandEncoder();
  e.copyBufferToBuffer(src, byteOffset, dst, 0, byteLength);
  device.queue.submit([e.finish()]);
  await dst.mapAsync(GPUMapMode.READ);
  const copy = dst.getMappedRange().slice(0);
  dst.unmap(); dst.destroy();
  return copy;
}

async function main() {
  if (!navigator.gpu) { log('no WebGPU'); R.error = 'no webgpu'; return finish(); }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  const device = await adapter.requestDevice();

  let gpuErrors = [];
  device.addEventListener?.('uncapturederror', e => { gpuErrors.push(e.error.message); log('GPU ERROR: ' + e.error.message); });

  const world = buildWorld();
  const chunks = Array.from(world.chunks.values());
  log(`world: ${chunks.length} chunks · mode: ${READBACK ? 'readback (cpu arrays)' : 'device-resident'}`);

  const cpu = new CpuSmoothMesher();
  const gpu = new GpuSmoothMesher(device, { capacity: 32, readback: READBACK });

  // WGSL compile check first - everything else is meaningless if it failed
  await device.queue.onSubmittedWorkDone();
  if (gpuErrors.length) { R.error = 'shader'; return finish(); }
  log('pipelines created, no shader errors.\n');

  let allOk = true;

  for (const smoothing of [0, 1, 2, 3]) {
    let vertsOk = 0, vertsBad = 0, trisOk = 0, trisBad = 0, totalVerts = 0, totalTris = 0;
    let maxPosUlp = 0, maxNrmUlp = 0, exactChunks = 0;
    let firstFailure = null;

    for (let start = 0; start < chunks.length; start += gpu.capacity) {
      const batch = chunks.slice(start, start + gpu.capacity).map((chunk) => ({
        chunk, world, occluders: null, smoothing, flipped: true, occlusionMode: 'primary'
      }));

      const gpuResults = await gpu.meshBatch(batch);

      for (let i = 0; i < batch.length; i++) {
        const cpuResult = await cpu.mesh(batch[i]);
        const g = gpuResults[i];
        const key = batch[i].chunk.key.key;

        totalVerts += cpuResult.vertexCount;
        totalTris += cpuResult.indexCount / 3;

        if (g.vertexCount !== cpuResult.vertexCount || g.indexCount !== cpuResult.indexCount) {
          vertsBad++;
          firstFailure = firstFailure || `chunk ${key} counts: gpu ${g.vertexCount}v/${g.indexCount}i vs cpu ${cpuResult.vertexCount}v/${cpuResult.indexCount}i`;
          allOk = false;
          continue;
        }

        if (cpuResult.vertexCount === 0) { vertsOk++; trisOk++; continue; }

        const h = g.handle;
        const vBytes = cpuResult.vertexCount * 3 * 4;
        const iBytes = cpuResult.indexCount * 4;

        const gv = READBACK ? g.vertices : new Float32Array(await readBuffer(device, h.positions, h.vertexByteOffset, vBytes));
        const gn = READBACK ? g.normals : new Float32Array(await readBuffer(device, h.normals, h.normalByteOffset, vBytes));
        const gi = READBACK ? g.indices : new Uint32Array(await readBuffer(device, h.indices, h.indexByteOffset, iBytes));

        // Positions are compared with a tolerance and normals exactly, because
        // the two are not computed the same way: the CPU accumulates the edge
        // crossings in JavaScript doubles and rounds once when it stores into a
        // Float32Array, while the shader works in fp32 throughout. The blur that
        // feeds them is exact on both sides, so any difference here is that final
        // rounding, not a divergence in the field or the topology.
        let vertexMatch = true;
        let exact = true;

        for (let k = 0; k < gv.length; k++) {
          const cv = cpuResult.vertices[k];
          const cn = cpuResult.normals[k];

          if (gv[k] !== cv || gn[k] !== cn) { exact = false; }

          // Absolute, not relative: positions live in chunk-local units 0..4,
          // so a relative measure explodes near the origin and says nothing.
          const posDiff = Math.abs(gv[k] - cv);
          const nrmDiff = Math.abs(gn[k] - cn);

          maxPosUlp = Math.max(maxPosUlp, posDiff);
          maxNrmUlp = Math.max(maxNrmUlp, nrmDiff);

          // One ulp of fp32 at the top of the coordinate range (4.0 units, one
          // chunk) is 4.8e-7, and that is exactly what the CPU-in-fp64 versus
          // GPU-in-fp32 difference comes to. The tolerance is two of those.
          if (posDiff > 1e-6 || nrmDiff > 1e-6) {
            vertexMatch = false;
            firstFailure = firstFailure || `chunk ${key} vertex[${k}]: gpu ${gv[k]}/${gn[k]} vs cpu ${cv}/${cn} (abs ${posDiff.toExponential(2)})`;
            break;
          }
        }

        if (exact) { exactChunks++; }

        if (vertexMatch) { vertsOk++; } else { vertsBad++; allOk = false; }

        const a = triangleKeys(gi, gi.length);
        const b = triangleKeys(cpuResult.indices, cpuResult.indices.length);
        let triMatch = a.length === b.length;
        if (triMatch) for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) { triMatch = false; firstFailure = firstFailure || `chunk ${key} triangle ${k}: gpu ${a[k]} vs cpu ${b[k]}`; break; }

        triMatch ? trisOk++ : trisBad++;
        if (!triMatch) allOk = false;
      }
    }

    const status = (vertsBad === 0 && trisBad === 0) ? 'MATCH' : 'MISMATCH';
    log(`smoothing ${smoothing}: ${totalVerts} verts, ${totalTris} tris`);
    log(`   triangles: ${trisOk}/${trisOk + trisBad} chunks exact (topology, numbering, winding, seams)`);
    log(`   positions: ${vertsOk}/${vertsOk + vertsBad} chunks within tolerance, ${exactChunks} bit-identical, max absolute deviation ${maxPosUlp.toExponential(2)} units (${(maxPosUlp / 0.25).toExponential(2)} of a BitVoxel)`);
    log(`   normals:   max absolute deviation ${maxNrmUlp.toExponential(2)}`);
    log(`   → ${status}`);
    if (firstFailure) log(`   first failure: ${firstFailure}`);

    R.cases.push({ smoothing, vertsOk, vertsBad, trisOk, trisBad, totalVerts, totalTris, maxPosUlp, maxNrmUlp, exactChunks });
  }

  // ---- throughput, once correctness is established ----
  log('\n--- throughput (smoothing 1, batch of ' + Math.min(chunks.length, gpu.capacity) + ') ---');

  const timed = chunks.slice(0, gpu.capacity).map((chunk) => ({
    chunk, world, occluders: null, smoothing: 1, flipped: true, occlusionMode: 'primary'
  }));

  async function timeAsync(fn, minMs) {
    await fn(); await fn();
    let reps = 1;
    for (;;) {
      const start = performance.now();
      for (let i = 0; i < reps; i++) { await fn(); }
      const elapsed = performance.now() - start;
      if (elapsed >= minMs) { return elapsed / reps; }
      reps = Math.max(reps * 2, Math.ceil(reps * (minMs / Math.max(elapsed, 0.01))));
    }
  }

  const cpuMs = await timeAsync(async () => { for (const r of timed) { await cpu.mesh(r); } }, 500);
  const gpuMs = await timeAsync(async () => { await gpu.meshBatch(timed); }, 500);

  R.throughput = {
    visible: !document.hidden,
    chunks: timed.length,
    cpuMs, gpuMs,
    cpuPerChunk: cpuMs * 1000 / timed.length,
    gpuPerChunk: gpuMs * 1000 / timed.length,
    speedup: cpuMs / gpuMs,
    readback: READBACK
  };

  log(`  CPU (1 thread): ${cpuMs.toFixed(3)} ms = ${(cpuMs * 1000 / timed.length).toFixed(1)} us/chunk`);
  log(`  GPU (${READBACK ? 'with readback' : 'device-resident'}): ${gpuMs.toFixed(3)} ms = ${(gpuMs * 1000 / timed.length).toFixed(1)} us/chunk`);
  log(`  ${(cpuMs / gpuMs).toFixed(2)}x`);
  if (document.hidden) { log('  WARNING: tab was hidden - the CPU figure is demoted to the efficiency cores and is not usable'); }

  R.allOk = allOk;
  R.gpuErrors = gpuErrors;
  log(`\nuncaptured GPU errors: ${gpuErrors.length}`);
  log(allOk ? '\n=== GPU TOPOLOGY IS EXACT; POSITIONS AGREE TO fp32 ROUNDING ===' : '\n=== MISMATCH ===');
  finish();
}

function finish() { window.__R__ = R; window.__DONE__ = true; console.log('[VERIFY-JSON] ' + JSON.stringify(R)); }

main().catch(e => { log('FATAL: ' + (e && e.stack || e)); R.error = String(e && e.message || e); finish(); });
</script>
